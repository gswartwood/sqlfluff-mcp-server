[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqlfluff-mcp-server"
version = "0.2.0"
description = "MCP server exposing SQLFluff linting, fixing, and parsing over the Model Context Protocol."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Guy Swartwood" }]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=2.0.0,<3.0.0",
    "sqlfluff>=3.0.0",
]

[project.scripts]
sqlfluff-mcp-server = "sqlfluff_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sqlfluff_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["EXE002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
